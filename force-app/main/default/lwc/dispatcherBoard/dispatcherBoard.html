<template>
    <div class="dispatcher-board slds-var-p-around_medium">
        <!-- 상단 요약 통계 바 -->
        <div class="slds-grid slds-wrap slds-gutters_small slds-var-m-bottom_medium stats-bar">
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                <div class="slds-box slds-box_x-small stat-card">
                    <p class="stat-label">총 건수</p>
                    <p class="stat-value">{summary.totalCount}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                <div class="slds-box slds-box_x-small stat-card stat-unassigned">
                    <p class="stat-label">미배정</p>
                    <p class="stat-value">{summary.unassignedCount}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                <div class="slds-box slds-box_x-small stat-card stat-in-progress">
                    <p class="stat-label">진행 중</p>
                    <p class="stat-value">{summary.inProgressCount}</p>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                <div class="slds-box slds-box_x-small stat-card stat-completed">
                    <p class="stat-label">완료</p>
                    <p class="stat-value">{summary.completedCount}</p>
                </div>
            </div>
        </div>

        <template if:true={hasError}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-var-m-bottom_medium" role="alert">
                <span>{loadError}</span>
            </div>
        </template>

        <div class="slds-grid slds-wrap board-layout">
            <!-- 좌측 2/3: 상태별 칸반 컬럼 -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12 kanban-wrapper">
                <div class="kanban-columns">
                    <template for:each={columns} for:item="column">
                        <div key={column.status} class="kanban-column">
                            <div class={column.headerClass}>
                                <h3 class="slds-text-heading_small">{column.label}</h3>
                                <span class="column-count">{column.workOrders.length}</span>
                            </div>
                            <div class="column-body">
                                <template for:each={column.workOrders} for:item="wo">
                                    <div
                                        key={wo.workOrderId}
                                        class={wo.cardClass}
                                        data-id={wo.workOrderId}
                                        onclick={handleCardClick}
                                    >
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-start">
                                            <span class="wo-number">{wo.workOrderNumber}</span>
                                            <span class={wo.priorityBadgeClass}>{wo.priority}</span>
                                        </div>
                                        <p class="wo-customer">{wo.customerName}</p>
                                        <p class="wo-address">{wo.serviceAddress}</p>
                                        <p class="wo-eta">ETA: {wo.etaLabel}</p>
                                        <div class="slds-var-m-top_x-small reassign-control" onclick={stopPropagation}>
                                            <lightning-combobox
                                                label="기술자 재배정"
                                                variant="label-hidden"
                                                placeholder="기술자 재배정"
                                                value={wo.assignedTechnicianId}
                                                options={technicianOptions}
                                                data-id={wo.workOrderId}
                                                onchange={handleReassign}
                                            ></lightning-combobox>
                                        </div>
                                    </div>
                                </template>
                                <template if:false={column.hasWorkOrders}>
                                    <p class="empty-column">작업 없음</p>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 우측 1/3: 기술자 위치 목록 패널 (지도 API는 다음 단계) -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 technician-wrapper">
                <div class="slds-box technician-panel">
                    <h3 class="slds-text-heading_small slds-var-m-bottom_small">기술자 위치</h3>
                    <template for:each={technicians} for:item="tech">
                        <div key={tech.technicianId} class="technician-row slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <div>
                                <p class="tech-name">{tech.name}</p>
                                <p class="tech-region">{tech.serviceRegion}</p>
                            </div>
                            <span class={tech.availabilityBadgeClass}>{tech.availabilityLabel}</span>
                        </div>
                    </template>
                    <template if:false={technicians.length}>
                        <p class="empty-column">등록된 기술자가 없습니다</p>
                    </template>
                </div>
            </div>
        </div>
    </div>
</template>
